name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create --project-name antigravity_robot build_env
          cp flutter_app/lib/main.dart build_env/lib/main.dart
          cp flutter_app/pubspec.yaml build_env/pubspec.yaml

      - name: Build APK
        working-directory: ./build_env
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robot-control-app
          path: build_env/build/app/outputs/flutter-apk/app-release.apk
